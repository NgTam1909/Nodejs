<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Chatbot</title>
</head>
<body>
<h2>Gemini Chatbot</h2>

<div id="chat"></div>

<input id="msg" placeholder="Nhập tin nhắn..." />
<button onclick="send()">Gửi</button>
        <script>
            async function send() {
            const input = document.getElementById("msg");
            const message = input.value.trim();

            // 1) Không gửi khi ô trống
            if (!message) {
            return;
        }

            // 2) Hiển thị tin nhắn người dùng
            document.getElementById("chat").innerHTML += `
            <p><b>Bạn:</b> ${message}</p>
    `;

            // Gọi API chatbot
            const res = await fetch("http://localhost:3000/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });

            const data = await res.json();

            // 3) Hiển thị câu trả lời từ bot
            document.getElementById("chat").innerHTML += `
        <p><b>Bot:</b> ${data.reply}</p>
    `;

            // 4) XÓA input sau khi gửi
            input.value = "";

            // 5) Focus lại input cho tiện chat
            input.focus();
        }
</script>
</body>
</html>
